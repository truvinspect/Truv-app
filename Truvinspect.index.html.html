let uid = 1;
const nextId = () => `id${uid++}`;

function makeInitialSections(template) {
  return (template || FULL_SECTIONS).map((s) => ({
    id: nextId(),
    name: s.name,
    items: s.items.map((it) => {
      const isObj = typeof it === "object";
      return { id: nextId(), name: isObj ? it.name : it, guide: isObj ? it.guide : "", status: null, notes: "", photos: [] };
    }),
  }));
}

const REPORTS_INDEX_KEY = "truv-reports-index-v1";

const COMPANY = {
  phone: "(813) 420-7195",
  email: "truvinspect@gmail.com",
  website: "truvinspect.com",
};

function InspectionReportBuilder() {
  const [screen, setScreen] = useState("list"); // list | chooseType | edit | preview
  const [reportsIndex, setReportsIndex] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [reportType, setReportType] = useState("full");
  const [property, setProperty] = useState({
    address: "", client: "", inspector: "", date: "",
  });
  const [sections, setSections] = useState(() => makeInitialSections(FULL_SECTIONS));
  const [open, setOpen] = useState(() => new Set([]));
  const [addingSection, setAddingSection] = useState(false);
  const [newSectionName, setNewSectionName] = useState("");
  const [newItemFor, setNewItemFor] = useState(null);
  const [newItemName, setNewItemName] = useState("");
  const [loaded, setLoaded] = useState(false);

  const reportKey = (id) => `truv-report-${id}`;

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(REPORTS_INDEX_KEY);
        if (res && res.value) setReportsIndex(JSON.parse(res.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const openReport = async (id) => {
    try {
      const res = await storage.get(reportKey(id));
      if (res && res.value) {
        const data = JSON.parse(res.value);
        setProperty(data.property || { address: "", client: "", inspector: "", date: "" });
        setReportType(data.reportType || "full");
        setSections(
          (data.sections || makeInitialSections(FULL_SECTIONS)).map((s) => ({
            ...s,
            items: s.items.map((it) => ({ ...it, photos: it.photos || [] })),
          }))
        );
      }
    } catch (e) {}
    setCurrentId(id);
    setScreen("edit");
    setOpen(new Set());
  };

  const createReport = (type) => {
    const id = `r${Date.now()}`;
    setProperty({ address: "", client: "", inspector: "", date: "" });
    setReportType(type);
    setSections(makeInitialSections(REPORT_TYPES[type].sections));
    setCurrentId(id);
    setScreen("edit");
    setOpen(new Set());
  };

  const deleteReport = async (id, e) => {
    e.stopPropagation();
    const next = reportsIndex.filter((r) => r.id !== id);
    setReportsIndex(next);
    try {
      await storage.set(REPORTS_INDEX_KEY, JSON.stringify(next));
      await storage.delete(reportKey(id));
    } catch (err) {}
  };

  const backToList = () => setScreen("list");

  useEffect(() => {
    if (!loaded || !currentId) return;
    const t = setTimeout(async () => {
      try {
        const full = { property, sections, reportType };
        await storage.set(reportKey(currentId), JSON.stringify(full));

        const allItems = sections.flatMap((s) => s.items);
        const summary = {
          id: currentId,
          address: property.address || "Untitled report",
          client: property.client,
          date: property.date,
          reportType,
          done: allItems.filter((it) => it.status).length,
          total: allItems.length,
          updatedAt: Date.now(),
        };
        setReportsIndex((prev) => {
          const rest = prev.filter((r) => r.id !== currentId);
          const next = [summary, ...rest];
          storage.set(REPORTS_INDEX_KEY, JSON.stringify(next)).catch(() => {});
          return next;
        });
      } catch (e) {}
    }, 500);
    return () => clearTimeout(t);
  }, [property, sections, loaded, currentId, reportType]);

  const toggleSection = (id) =>
    setOpen((prev) => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });

  const updateItem = useCallback((sectionId, itemId, patch) => {
    setSections((prev) =>
      prev.map((s) =>
        s.id !== sectionId
          ? s
          : { ...s, items: s.items.map((it) => (it.id === itemId ? { ...it, ...patch } : it)) }
      )
    );
  }, []);

  const addPhotos = (sectionId, itemId, fileList) => {
    const files = Array.from(fileList || []);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => {
        setSections((prev) =>
          prev.map((s) =>
            s.id !== sectionId
              ? s
              : {
                  ...s,
                  items: s.items.map((it) =>
                    it.id !== itemId
                      ? it
                      : { ...it, photos: [...it.photos, { id: nextId(), src: reader.result }] }
                  ),
                }
          )
        );
      };
      reader.readAsDataURL(file);
    });
  };

  const removePhoto = (sectionId, itemId, photoId) => {
    setSections((prev) =>
      prev.map((s) =>
        s.id !== sectionId
          ? s
          : {
              ...s,
              items: s.items.map((it) =>
                it.id !== itemId ? it : { ...it, photos: it.photos.filter((p) => p.id !== photoId) }
              ),
            }
      )
    );
  };

  const addSection = () => {
    const name = newSectionName.trim();
    if (!name) return;
    setSections((prev) => [...prev, { id: nextId(), name, items: [] }]);
    setNewSectionName("");
    setAddingSection(false);
  };

  const removeSection = (id) => setSections((prev) => prev.filter((s) => s.id !== id));

  const addItem = (sectionId) => {
    const name = newItemName.trim();
    if (!name) return;
    setSections((prev) =>
      prev.map((s) =>
        s.id !== sectionId
          ? s
          : { ...s, items: [...s.items, { id: nextId(), name, status: null, notes: "", photos: [] }] }
      )
    );
    setNewItemName("");
    setNewItemFor(null);
  };

  const removeItem = (sectionId, itemId) =>
    setSections((prev) =>
      prev.map((s) => (s.id !== sectionId ? s : { ...s, items: s.items.filter((it) => it.id !== itemId) }))
    );

  const allItems = sections.flatMap((s) => s.items);
  const total = allItems.length;
  const done = allItems.filter((it) => it.status).length;
  const flagged = allItems.filter((it) => it.status === "poor" || it.status === "fair").length;

  const deleteCurrentReport = async () => {
    const id = currentId;
    setReportsIndex((prev) => {
      const next = prev.filter((r) => r.id !== id);
      storage.set(REPORTS_INDEX_KEY, JSON.stringify(next)).catch(() => {});
      return next;
    });
    try { await storage.delete(reportKey(id)); } catch (e) {}
    setScreen("list");
  };

  return (
    <div style={{ background: paper, minHeight: "100vh", color: ink, fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .print-page { background: white !important; }
        }
        input, textarea { font-family: inherit; }
        input::placeholder, textarea::placeholder { color: #8A9AA2; }
      `}</style>

      <div className="no-print" style={{ background: slateDeep, color: "#EAF0F2", padding: "18px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={LOGO} alt="Truv Property Inspections" style={{ height: 40, width: "auto" }} />
        </div>
        <div style={{ fontSize: 12.5, opacity: 0.75, marginTop: 2 }}>Field report builder</div>
        <div style={{ fontSize: 11.5, opacity: 0.85, marginTop: 6, lineHeight: 1.5 }}>
          Florida Licensed Home Inspector<br />
          {COMPANY.phone} · {COMPANY.email} · {COMPANY.website}
        </div>
        {screen !== "list" && (
          <button onClick={backToList} className="no-print" style={{ marginTop: 10, background: "none", border: "none", color: "#CFE0E6", fontSize: 12.5, cursor: "pointer", padding: 0 }}>
            ← All client reports
          </button>
        )}
      </div>

      {screen === "list" && (
        <ReportsList reports={reportsIndex} onOpen={openReport} onCreate={() => setScreen("chooseType")} onDelete={deleteReport} />
      )}

      {screen === "chooseType" && (
        <ChooseType onPick={createReport} onBack={() => setScreen("list")} />
      )}

      {screen === "edit" && (
        <div style={{ padding: "14px 14px 90px" }}>
          <div style={{ background: "white", border: `1px solid ${line}`, borderRadius: 6, padding: 14, marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, color: slateDeep, marginBottom: 10 }}>
              <HomeIcon size={15} /> PROPERTY & CLIENT
            </div>
            <Field label="Property address" value={property.address} onChange={(v) => setProperty((p) => ({ ...p, address: v }))} />
            <Field label="Client name" value={property.client} onChange={(v) => setProperty((p) => ({ ...p, client: v }))} />
            <Field label="Inspector" value={property.inspector} onChange={(v) => setProperty((p) => ({ ...p, inspector: v }))} />
            <Field label="Inspection date" type="date" value={property.date} onChange={(v) => setProperty((p) => ({ ...p, date: v }))} />
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            <StatBox label="Completed" value={`${done}/${total}`} />
            <StatBox label="Flagged" value={flagged} color={flagged > 0 ? poor : good} />
          </div>

          {sections.map((section) => (
            <div key={section.id} style={{ background: "white", border: `1px solid ${line}`, borderRadius: 6, marginBottom: 10, overflow: "hidden" }}>
              <button
                onClick={() => toggleSection(section.id)}
                style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", background: paperDeep, border: "none", cursor: "pointer" }}
              >
                <span style={{ fontWeight: 600, fontSize: 15 }}>{section.name}</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 12, color: "#4A5A61" }}>
                    {section.items.filter((it) => it.status).length}/{section.items.length}
                  </span>
                  {open.has(section.id) ? <ChevronDownIcon size={18} /> : <ChevronRightIcon size={18} />}
                </span>
              </button>

              {open.has(section.id) && (
                <div style={{ padding: "6px 14px 14px" }}>
                  {section.items.map((item) => (
                    <ItemRow
                      key={item.id}
                      item={item}
                      onStatus={(status) => updateItem(section.id, item.id, { status })}
                      onNotes={(notes) => updateItem(section.id, item.id, { notes })}
                      onAddPhotos={(files) => addPhotos(section.id, item.id, files)}
                      onRemovePhoto={(pid) => removePhoto(section.id, item.id, pid)}
                      onRemoveItem={() => removeItem(section.id, item.id)}
                    />
                  ))}

                  {newItemFor === section.id ? (
                    <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                      <input
                        autoFocus
                        value={newItemName}
                        onChange={(e) => setNewItemName(e.target.value)}
                        onKeyDown={(e) => e.key === "Enter" && addItem(section.id)}
                        placeholder="New item name"
                        style={inputStyle}
                      />
                      <button onClick={() => addItem(section.id)} style={smallBtn(slate)}>Add</button>
                    </div>
                  ) : (
                    <button
                      onClick={() => { setNewItemFor(section.id); setNewItemName(""); }}
                      style={{ ...ghostBtn, marginTop: 8 }}
                    >
                      <PlusIcon size={14} /> Add item
                    </button>
                  )}

                  <button onClick={() => removeSection(section.id)} style={{ ...ghostBtn, marginTop: 6, color: poor }}>
                    <TrashIcon size={13} /> Remove section
                  </button>
                </div>
              )}
            </div>
          ))}

          {addingSection ? (
            <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
              <input
                autoFocus
                value={newSectionName}
                onChange={(e) => setNewSectionName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addSection()}
                placeholder="New section name"
                style={inputStyle}
              />
              <button onClick={addSection} style={smallBtn(slate)}>Add</button>
            </div>
          ) : (
            <button onClick={() => setAddingSection(true)} style={{ ...ghostBtn, marginBottom: 14 }}>
              <PlusIcon size={14} /> Add section
            </button>
          )}

          <button onClick={deleteCurrentReport} style={{ ...ghostBtn, color: poor, fontSize: 12 }}>
            <TrashIcon size={13} /> Delete this report
          </button>
        </div>
      )}

      {screen === "preview" && <ReportPreview property={property} sections={sections} reportType={reportType} />}

      {(screen === "edit" || screen === "preview") && (
      <div className="no-print" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "white", borderTop: `1px solid ${line}`, padding: 10, display: "flex", gap: 8 }}>
        {screen === "edit" ? (
          <button onClick={() => setScreen("preview")} style={{ ...fullBtn(slateDeep) }}>
            <ClipboardIcon size={16} /> Finish & preview report ({done}/{total})
          </button>
        ) : (
          <>
            <button onClick={() => setScreen("edit")} style={{ ...fullBtn("#EFF3F4"), color: ink, flex: 1 }}>
              Back to edit
            </button>
            <button onClick={() => window.print()} style={{ ...fullBtn(slateDeep), flex: 1 }}>
              <PrinterIcon size={16} /> Print / save PDF
            </button>
          </>
        )}
      </div>
      )}
    </div>
  );
}

function ChooseType({ onPick, onBack }) {
  const options = [
    { key: "full", desc: "Complete room-by-room inspection covering every major system." },
    { key: "fourpoint", desc: "Roof, electrical, plumbing & HVAC — for insurance underwriting on older homes." },
    { key: "windmit", desc: "Roof-to-wall attachment, opening protection & more — for wind insurance discounts." },
  ];
  return (
    <div style={{ padding: "16px 14px 30px" }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: slateDeep, marginBottom: 12 }}>
        CHOOSE A REPORT TYPE
      </div>
      {options.map((o) => {
        const t = REPORT_TYPES[o.key];
        return (
          <button
            key={o.key}
            onClick={() => onPick(o.key)}
            style={{
              display: "block", width: "100%", textAlign: "left", background: "white",
              border: `1px solid ${line}`, borderRadius: 6, padding: "14px", marginBottom: 10, cursor: "pointer",
            }}
          >
            <div style={{ fontWeight: 700, fontSize: 15, color: ink }}>{t.label}</div>
            <div style={{ fontSize: 12.5, color: "#5A6A70", marginTop: 4, lineHeight: 1.4 }}>{o.desc}</div>
          </button>
        );
      })}
      <button onClick={onBack} style={{ ...ghostBtn, marginTop: 4 }}>Cancel</button>
    </div>
  );
}

function ReportsList({ reports, onOpen, onCreate, onDelete }) {
  const sorted = [...reports].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return (
    <div style={{ padding: "16px 14px 30px" }}>
      <button
        onClick={onCreate}
        style={{ ...fullBtn(slateDeep), width: "100%", marginBottom: 16, padding: "13px" }}
      >
        <PlusIcon size={16} /> New inspection report
      </button>

      {sorted.length === 0 ? (
        <div style={{ textAlign: "center", color: "#6B7A80", fontSize: 13.5, marginTop: 30 }}>
          No reports yet. Start one above for your next client — it'll be saved here on this device so you can pick it back up any time.
        </div>
      ) : (
        sorted.map((r) => (
          <div
            key={r.id}
            onClick={() => onOpen(r.id)}
            style={{ background: "white", border: `1px solid ${line}`, borderRadius: 6, padding: "12px 14px", marginBottom: 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}
          >
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 14.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {r.address || "Untitled report"}
              </div>
              <div style={{ fontSize: 12, color: "#5A6A70", marginTop: 2 }}>
                {(REPORT_TYPES[r.reportType || "full"] || REPORT_TYPES.full).label}
                {r.client ? ` · ${r.client}` : ""} · {r.done || 0}/{r.total || 0} items{r.date ? ` · ${r.date}` : ""}
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
              <button onClick={(e) => onDelete(r.id, e)} style={{ background: "none", border: "none", color: "#B7C1C5", cursor: "pointer", padding: 4 }}>
                <TrashIcon size={16} />
              </button>
              <ChevronRightIcon size={18} color="#B7C1C5" />
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function Field({ label, value, onChange, type = "text" }) {
  return (
    <div style={{ marginBottom: 8 }}>
      <label style={{ fontSize: 11.5, color: "#5A6A70", display: "block", marginBottom: 3 }}>{label}</label>
      <input type={type} value={value} onChange={(e) => onChange(e.target.value)} style={inputStyle} />
    </div>
  );
}

function StatBox({ label, value, color = slateDeep }) {
  return (
    <div style={{ flex: 1, background: "white", border: `1px solid ${line}`, borderRadius: 6, padding: "10px 12px" }}>
      <div style={{ fontSize: 20, fontWeight: 700, color, fontFamily: "Georgia, serif" }}>{value}</div>
      <div style={{ fontSize: 11, color: "#5A6A70" }}>{label}</div>
    </div>
  );
}

function ItemRow({ item, onStatus, onNotes, onAddPhotos, onRemovePhoto, onRemoveItem }) {
  const [showNotes, setShowNotes] = useState(false);
  const [showGuide, setShowGuide] = useState(false);
  const fileRef = useRef(null);

  return (
    <div style={{ borderTop: `1px solid #EEF2F3`, padding: "10px 0" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 14, flex: 1 }}>{item.name}</span>
        <button onClick={onRemoveItem} style={{ background: "none", border: "none", color: "#B7C1C5", cursor: "pointer", padding: 2 }}>
          <XIcon size={14} />
        </button>
      </div>

      <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
        {Object.entries(STATUS).map(([key, s]) => {
          const IconComp = s.icon;
          const active = item.status === key;
          return (
            <button
              key={key}
              onClick={() => onStatus(active ? null : key)}
              style={{
                display: "flex", alignItems: "center", gap: 4, fontSize: 12, padding: "5px 9px",
                borderRadius: 4, border: `1px solid ${active ? s.color : line}`,
                background: active ? s.color : "white", color: active ? "white" : "#4A5A61",
                cursor: "pointer",
              }}
            >
              <IconComp size={12} /> {s.label}
            </button>
          );
        })}
        <button
          onClick={() => setShowNotes((v) => !v)}
          style={{ fontSize: 12, padding: "5px 9px", borderRadius: 4, border: `1px solid ${line}`, background: item.notes ? paperDeep : "white", color: "#4A5A61", cursor: "pointer" }}
        >
          Notes
        </button>
        {item.guide && (
          <button
            onClick={() => setShowGuide((v) => !v)}
            style={{ fontSize: 12, padding: "5px 9px", borderRadius: 4, border: `1px solid ${slate}`, background: showGuide ? slate : "white", color: showGuide ? "white" : slate, cursor: "pointer" }}
          >
            ⓘ Reference
          </button>
        )}
        <button
          onClick={() => fileRef.current?.click()}
          style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, padding: "5px 9px", borderRadius: 4, border: `1px solid ${line}`, background: "white", color: "#4A5A61", cursor: "pointer" }}
        >
          <CameraIcon size={12} /> Photo{item.photos.length ? ` (${item.photos.length})` : ""}
        </button>
        <input
          ref={fileRef}
          type="file"
          accept="image/*"
          multiple
          style={{ display: "none" }}
          onChange={(e) => { onAddPhotos(e.target.files); e.target.value = ""; }}
        />
      </div>

      {showGuide && item.guide && (
        <div style={{ marginTop: 6, padding: "8px 10px", background: "#EFF5F7", border: `1px solid ${line}`, borderRadius: 4, fontSize: 12, color: "#334750", lineHeight: 1.5 }}>
          {item.guide}
        </div>
      )}

      {showNotes && (
        <textarea
          value={item.notes}
          onChange={(e) => onNotes(e.target.value)}
          placeholder="Add a note about this item..."
          rows={2}
          style={{ ...inputStyle, marginTop: 6, resize: "vertical" }}
        />
      )}

      {item.photos.length > 0 && (
        <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
          {item.photos.map((p) => (
            <div key={p.id} style={{ position: "relative" }}>
              <img src={p.src} alt="" style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 4, border: `1px solid ${line}` }} />
              <button
                onClick={() => onRemovePhoto(p.id)}
                style={{ position: "absolute", top: -5, right: -5, background: poor, color: "white", border: "none", borderRadius: "50%", width: 16, height: 16, fontSize: 10, cursor: "pointer", lineHeight: 1 }}
              >
                ×
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ReportPreview({ property, sections, reportType }) {
  const typeInfo = REPORT_TYPES[reportType] || REPORT_TYPES.full;
  const flaggedSections = sections
    .map((s) => ({ ...s, items: s.items.filter((it) => it.status) }))
    .filter((s) => s.items.length > 0);

  return (
    <div className="print-page" style={{ background: "white", padding: 18, fontFamily: "Georgia, 'Iowan Old Style', serif" }}>
      <div style={{ borderBottom: `2px solid ${slateDeep}`, paddingBottom: 10, marginBottom: 14 }}>
        <img src={LOGO} alt="Truv Property Inspections" style={{ height: 56, width: "auto", marginBottom: 6 }} />
        <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 12.5, color: "#5A6A70", marginTop: 2 }}>
          {typeInfo.reportTitle} · Florida Licensed Home Inspector
        </div>
        <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 12, color: "#5A6A70", marginTop: 2 }}>
          {COMPANY.phone} · {COMPANY.email} · {COMPANY.website}
        </div>
      </div>

      <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, lineHeight: 1.7, marginBottom: 16 }}>
        <div><strong>Property:</strong> {property.address || "—"}</div>
        <div><strong>Client:</strong> {property.client || "—"}</div>
        <div><strong>Inspector:</strong> {property.inspector || "—"}</div>
        <div><strong>Date:</strong> {property.date || "—"}</div>
      </div>

      {flaggedSections.length === 0 && (
        <div style={{ fontFamily: "system-ui, sans-serif", fontSize: 13, color: "#5A6A70" }}>
          No items have been marked yet — go back to edit and set a condition for at least one item.
        </div>
      )}

      {flaggedSections.map((section) => (
        <div key={section.id} style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 15, color: slateDeep, borderBottom: `1px solid ${line}`, paddingBottom: 4, marginBottom: 8 }}>
            {section.name}
          </div>
          {section.items.map((item) => {
            const s = STATUS[item.status];
            return (
              <div key={item.id} style={{ fontFamily: "system-ui, sans-serif", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5 }}>
                  <span style={{ fontWeight: 600 }}>{item.name}</span>
                  <span style={{ fontSize: 11, padding: "2px 7px", borderRadius: 3, background: s.color, color: "white" }}>
                    {s.label}
                  </span>
                </div>
                {item.notes && <div style={{ fontSize: 12.5, color: "#3A4850", marginTop: 3 }}>{item.notes}</div>}
                {item.photos.length > 0 && (
                  <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                    {item.photos.map((p) => (
                      <img key={p.id} src={p.src} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 4, border: `1px solid ${line}` }} />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

const inputStyle = {
  width: "100%", padding: "8px 10px", fontSize: 13.5, border: `1px solid ${line}`,
  borderRadius: 4, background: "#FBFCFC", color: ink, boxSizing: "border-box",
};

const ghostBtn = {
  display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, background: "none",
  border: "none", color: slate, cursor: "pointer", padding: "4px 0",
};

const smallBtn = (bg) => ({
  padding: "8px 14px", fontSize: 13, background: bg, color: "white", border: "none",
  borderRadius: 4, cursor: "pointer", whiteSpace: "nowrap",
});

const fullBtn = (bg) => ({
  flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
  padding: "12px", fontSize: 14, fontWeight: 600, background: bg, color: "white",
  border: "none", borderRadius: 6, cursor: "pointer",
});

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<InspectionReportBuilder />);
</script>
<script>
(function () {
  var src = document.getElementById("app-src").textContent;
  var output = Babel.transform(src, { presets: ["react"] }).code;
  var s = document.createElement("script");
  s.textContent = output;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
